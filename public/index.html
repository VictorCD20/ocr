<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CODIA - OCR Comprobantes Cafetería</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Navigation Bar -->
  <header class="navbar">
    <div class="nav-container">
      <div class="brand">
        <div class="brand-icon">C</div>
        <div>
          <div class="brand-title">CODIA OCR</div>
          <div class="brand-subtitle">Control de Gastos & Comprobantes</div>
        </div>
      </div>
      <nav class="nav-tabs">
        <button class="tab-btn active" id="tab-registrar" onclick="switchTab('registrar')">Registrar Comprobante</button>
        <button class="tab-btn" id="tab-historial" onclick="switchTab('historial')">Historial y Revisión</button>
      </nav>
    </div>
  </header>

  <!-- Main Container -->
  <main class="container">

    <!-- Vista 1: Registrar Comprobante -->
    <section id="view-registrar" class="view-section active">
      <div class="grid-2col">
        
        <!-- Columna Izquierda: Subir y Vista Previa -->
        <div class="card">
          <div class="card-title">
            <span>1. Foto o Imagen del Comprobante</span>
            <span id="api-status" class="badge badge-aprobado" style="display:none;">API OK</span>
          </div>

          <div id="dropzone" class="upload-dropzone">
            <div class="upload-icon">📷</div>
            <div style="margin-bottom: 0.5rem;">
              <strong style="color: var(--text-primary);">Selecciona una opción</strong>
              <p style="font-size: 0.8rem; color: var(--text-secondary); margin-top: 0.25rem;">Para registrar el gasto de la cafetería</p>
            </div>
            
            <div style="display: flex; gap: 0.75rem; width: 100%; max-width: 320px; flex-wrap: wrap;">
              <button type="button" class="btn btn-primary" style="flex: 1; min-width: 130px; font-size: 0.85rem;" onclick="triggerCameraInput()">
                📷 Tomar foto
              </button>
              <button type="button" class="btn btn-secondary" style="flex: 1; min-width: 130px; font-size: 0.85rem;" onclick="triggerFileInput()">
                📁 Cargar foto
              </button>
            </div>

            <!-- Input 1: Cámara frontal/trasera directa -->
            <input type="file" id="input-camera" accept="image/*" capture="environment" style="display: none;" onchange="handleFileSelect(event)">
            <!-- Input 2: Galería / explorador de archivos con selección múltiple de fotos -->
            <input type="file" id="input-file" accept="image/*" multiple style="display: none;" onchange="handleFileSelect(event)">
          </div>

          <div id="preview-wrapper" class="preview-container" style="display: none;">
            <img id="image-preview" src="" alt="Vista previa del comprobante">
          </div>

          <div style="margin-top: 1.25rem; display: flex; gap: 0.75rem;">
            <button id="btn-process-ocr" class="btn btn-primary btn-block" onclick="processOCR()" disabled>
              <span>⚡ Leer comprobante</span>
            </button>
            <button id="btn-clear" class="btn btn-secondary" onclick="clearUpload()" style="display: none;">
              <span>🗑️ Tomar otra foto</span>
            </button>
          </div>

          <div id="ocr-alert" class="alert alert-warning" style="margin-top: 1rem;"></div>
        </div>

        <!-- Columna Derecha: Formulario de Datos / Revisión -->
        <div class="card">
          <div class="card-title">
            <span>2. Datos Extraídos / Modificar</span>
            <span id="badge-calidad" class="badge badge-categoria" style="display: none;">Calidad: buena</span>
          </div>

          <form id="form-comprobante" onsubmit="saveDocument(event)">
            <div class="form-grid">
              
              <div class="form-group full-width">
                <label for="input-proveedor">Proveedor / Emisor *</label>
                <input type="text" id="input-proveedor" required placeholder="Ej. Comercializadora de Café S.A.">
              </div>

              <div class="form-group">
                <label for="input-fecha">Fecha *</label>
                <input type="date" id="input-fecha" required>
              </div>

              <div class="form-group">
                <label for="input-hora">Hora</label>
                <input type="text" id="input-hora" placeholder="Ej. 20:42 o 08:42 PM">
              </div>

              <div class="form-group">
                <label for="input-total">Total ($) *</label>
                <input type="number" step="0.01" id="input-total" required placeholder="0.00">
              </div>

              <div class="form-group">
                <label for="input-subtotal">Subtotal ($)</label>
                <input type="number" step="0.01" id="input-subtotal" placeholder="0.00">
              </div>

              <div class="form-group">
                <label for="input-iva">IVA ($)</label>
                <input type="number" step="0.01" id="input-iva" placeholder="0.00">
              </div>

              <div class="form-group">
                <label for="select-categoria">Categoría *</label>
                <select id="select-categoria" required>
                  <option value="insumo">Insumo (Grano, leche, insumos)</option>
                  <option value="gasto">Gasto general (Servicios, renta)</option>
                  <option value="venta">Venta</option>
                  <option value="nomina">Nómina</option>
                  <option value="otro">Otro</option>
                </select>
              </div>

              <div class="form-group">
                <label for="input-rfc-emisor">RFC Emisor</label>
                <input type="text" id="input-rfc-emisor" placeholder="AAA010101AAA">
              </div>

              <div class="form-group">
                <label for="input-rfc-receptor">RFC Receptor</label>
                <input type="text" id="input-rfc-receptor" placeholder="BBB020202BBB">
              </div>

              <div class="form-group">
                <label for="input-folio">Folio / Ticket N°</label>
                <input type="text" id="input-folio" placeholder="F-12345">
              </div>

              <div class="form-group">
                <label for="select-metodo">Método de Pago</label>
                <select id="select-metodo">
                  <option value="efectivo">Efectivo</option>
                  <option value="tarjeta">Tarjeta Débito/Crédito</option>
                  <option value="transferencia">Transferencia / SPEI</option>
                  <option value="otro">Otro</option>
                </select>
              </div>

              <div class="form-group full-width">
                <label for="input-uuid">UUID (CFDI)</label>
                <input type="text" id="input-uuid" placeholder="AAAAAAAA-BBBB-CCCC-DDDD-EEEEEEEEEEEE">
              </div>

              <div class="form-group full-width">
                <label for="input-quien">¿Quién realizó el gasto?</label>
                <input type="text" id="input-quien" value="Dueña/Encargada" placeholder="Nombre de quien pagó">
              </div>

              <div class="form-group full-width">
                <label for="input-notas">Notas adicionales</label>
                <textarea id="input-notas" rows="2" placeholder="Observaciones sobre la compra..."></textarea>
              </div>

              <!-- Tabla de Conceptos Detectados -->
              <div class="form-group full-width">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 0.5rem;">
                  <label>Conceptos Detectados</label>
                  <button type="button" class="btn btn-secondary" style="padding: 0.25rem 0.5rem; font-size: 0.75rem;" onclick="addConceptoRow()">+ Agregar Ítem</button>
                </div>
                <table class="conceptos-table">
                  <thead>
                    <tr>
                      <th>Descripción</th>
                      <th style="width: 70px;">Cant.</th>
                      <th style="width: 90px;">P. Unit</th>
                      <th style="width: 90px;">Importe</th>
                      <th style="width: 30px;"></th>
                    </tr>
                  </thead>
                  <tbody id="conceptos-body">
                    <!-- Dinámico -->
                  </tbody>
                </table>
              </div>

              <div class="form-group full-width">
                <label for="select-estado">Estado de Registro</label>
                <select id="select-estado">
                  <option value="aprobado">Aprobado / Guardar como gasto</option>
                  <option value="pendiente_revision">Pendiente de revisión</option>
                  <option value="rechazado">Rechazado</option>
                </select>
              </div>

            </div>

            <div style="margin-top: 1.5rem; display: flex; gap: 1rem;">
              <button type="submit" id="btn-save" class="btn btn-primary btn-block">
                💾 Guardar Comprobante
              </button>
            </div>
          </form>

        </div>
      </div>
    </section>

    <!-- Vista 2: Historial y Revisión -->
    <section id="view-historial" class="view-section">
      <div class="card">
        <div class="card-title">
          <span>Historial de Comprobantes Registrados</span>
          <button class="btn btn-secondary" style="padding: 0.4rem 0.8rem; font-size: 0.8rem;" onclick="loadHistory()">🔄 Actualizar</button>
        </div>

        <div class="filters-bar">
          <div class="form-group">
            <label for="filter-estado">Filtrar por Estado</label>
            <select id="filter-estado" onchange="renderHistory()">
              <option value="todos">Todos los estados</option>
              <option value="aprobado">Aprobados</option>
              <option value="pendiente_revision">Pendiente de revisión</option>
              <option value="rechazado">Rechazados</option>
            </select>
          </div>

          <div class="form-group">
            <label for="filter-categoria">Filtrar por Categoría</label>
            <select id="filter-categoria" onchange="renderHistory()">
              <option value="todas">Todas las categorías</option>
              <option value="insumo">Insumos</option>
              <option value="gasto">Gastos generales</option>
              <option value="venta">Ventas</option>
              <option value="nomina">Nómina</option>
              <option value="otro">Otros</option>
            </select>
          </div>

          <div class="form-group" style="flex: 1;">
            <label for="search-input">Buscar proveedor o folio</label>
            <input type="text" id="search-input" placeholder="Escribe para buscar..." oninput="renderHistory()">
          </div>
        </div>

        <div id="history-container" class="doc-list">
          <!-- Dinámico -->
        </div>
      </div>
    </section>

  </main>

  <script src="app.js"></script>
</body>
</html>
